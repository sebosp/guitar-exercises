# Builds the web version with trunk and publishes it on GitHub Pages,
# https://sebosp.github.io/guitar-exercises/. The Pages source of the repository must be
# "GitHub Actions": the repository root is the trunk template, not the built site.
name: Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # .cargo/config.toml links the host builds (build scripts, proc macros) with clang and mold.
      - name: Install mold
        run: sudo apt-get update && sudo apt-get install -y mold clang
      - name: Install trunk
        run: |
          curl -sL https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz | tar -xz
          sudo mv trunk /usr/local/bin/
      - name: Build
        # The site lives under /guitar-exercises/.
        run: trunk build --release --public-url /guitar-exercises/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
